[package]
name = "rike-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "rike_app"
path = "src/lib.rs"

[[bin]]
name = "rike"
path = "src/main.rs"

[features]
# Lets `--dev-server` load the UI from a running `nsh dev --server-only`. Not for release builds.
dev = ["nsh-platform-linux/dev"]

[lints]
workspace = true

[dependencies]
env_logger.workspace = true
log.workspace = true
nsh-base.workspace = true
nsh-platform-linux = { workspace = true, features = ["js"] }
rike-native.workspace = true
rike-vault.workspace = true
tokio.workspace = true
