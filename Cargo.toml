[workspace]
resolver = "3"
members = [
    "crates/rike-core",
    "crates/rike-vault",
    "crates/rike-index",
    "crates/rike-native",
    "crates/rike-app",
    "spikes/typst-math",
]
default-members = [
    "crates/rike-core",
    "crates/rike-vault",
    "crates/rike-index",
    "crates/rike-native",
    "crates/rike-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rike-core = { path = "crates/rike-core" }
rike-vault = { path = "crates/rike-vault" }
rike-index = { path = "crates/rike-index" }
rike-native = { path = "crates/rike-native" }

blake3 = "1"
env_logger = { version = "0.11", default-features = false }
jieba-rs = "0.11"
log = "0.4"
notify-debouncer-full = "0.7"
opendal = { version = "=0.59.5", default-features = false, features = ["services-fs", "executors-tokio"] }
proptest = "1"
tantivy = "0.27"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

# Formula rendering (TeX -> Typst -> PNG). Pinned: Typst's API changes between minors.
mitex = "=0.2.4"
typst = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-layout = "=0.15.1"
typst-render = "=0.15.1"

nsh-core = { git = "https://github.com/longbridge/nsh" }
nsh-base = { git = "https://github.com/longbridge/nsh", default-features = false, features = ["highlight"] }
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", default-features = false }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Typst and the image codecs are far too slow unoptimised; debug builds and
# `cargo test` render formulas too.
[profile.dev.package."*"]
opt-level = 2
